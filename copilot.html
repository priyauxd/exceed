<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Copilot — AGM Sales EXEED CRM</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet" />
  <link href="fluent-tokens.css?v=3" rel="stylesheet" />
  <style>
    :root {
      --bg: #f5f5f5;
      --surface: #ffffff;
      --ink: #242424;
      --ink-secondary: #424242;
      --ink-muted: #616161;
      --border: #e0e0e0;
      --blue: #0f6cbd;
      --topbar-h: 42px;
      --sidebar-w: 228px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
    }
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 20;
      height: var(--topbar-h); background: #0b1d33; color: #fff;
      display: flex; align-items: center; gap: 12px; padding: 0 14px; font-size: 12px;
    }
    .topbar .app-name { font-weight: 600; }
    .topbar .sep { width: 1px; height: 16px; background: rgba(255,255,255,.25); }
    .topbar .spacer { flex: 1; }
    .topbar .avatar {
      width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,.2);
      display: grid; place-items: center; font-size: 10px; font-weight: 600;
    }
    .sidebar {
      position: fixed; top: var(--topbar-h); left: 0; bottom: 0; width: var(--sidebar-w);
      background: var(--surface); border-right: 1px solid var(--border);
      padding: 10px 8px; overflow-y: auto;
    }
    .sb-item {
      display: flex; align-items: center; gap: 10px; padding: 9px 10px;
      border-radius: 6px; color: var(--ink-secondary); text-decoration: none; font-size: 12.5px;
    }
    .sb-item:hover { background: #eff6fc; color: var(--blue); }
    .sb-item.active { background: #eff6fc; color: var(--blue); font-weight: 600; }
    .sb-item .material-symbols-outlined { font-size: 18px; }
    .main { margin: var(--topbar-h) 0 0 var(--sidebar-w); padding: 28px 32px; min-height: calc(100vh - var(--topbar-h)); }

    /* ── Copilot launcher: extended pill in a gradient ring, docked bottom-right ── */
    /* dock must NOT clip — it hosts the tooltip */
    .cp-fab-dock { position: fixed; right: 28px; bottom: 28px; z-index: 40; line-height: 0; }
    .cp-fab {
      position: relative; z-index: 1; width: 64px; height: 64px; padding: 4px; border: none;
      border-radius: 50%; background: #ffffff; cursor: pointer;
      display: grid; place-items: center;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 6px 18px rgba(118,50,205,.30), 0 2px 6px rgba(20,24,34,.12);
      transition: transform .24s cubic-bezier(.34,1.5,.64,1), box-shadow .24s;
    }
    /* fixed px: a percentage height on an auto-sized grid item leaves the svg at its intrinsic 231px */
    .cp-mark { position: relative; display: block; width: 56px; height: 56px; }
    .cp-mark-svg { position: relative; display: block; width: 56px; height: 56px; animation: cpSteer 6s cubic-bezier(.45,0,.55,1) infinite, cpBreathe 3.6s ease-in-out infinite; }
    @keyframes cpSteer { 0%, 100% { rotate: -16deg; } 50% { rotate: 16deg; } }
    @keyframes cpBreathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
    .cp-halo {
      position: absolute; left: 50%; top: 50%; width: 78%; height: 78%; border-radius: 50%;
      transform: translate(-50%,-50%); pointer-events: none;
      background: radial-gradient(circle, rgba(170,115,245,.65) 0%, rgba(125,65,225,0) 70%);
      animation: cpHalo 3.6s ease-in-out infinite;
    }
    @keyframes cpHalo { 0%,100% { opacity: .3; transform: translate(-50%,-50%) scale(.8); } 50% { opacity: .85; transform: translate(-50%,-50%) scale(1.2); } }
    .cp-tw { position: absolute; fill: #fff; opacity: 0; pointer-events: none;
      filter: drop-shadow(0 0 4px rgba(170,215,255,.95)); animation: cpTw 3.6s ease-in-out infinite; }
    .cp-tw.t1 { width: 20%; height: 20%; top: 4%; right: 6%; animation-delay: .1s; }
    .cp-tw.t2 { width: 14%; height: 14%; bottom: 8%; left: 3%; animation-delay: 1.3s; }
    .cp-tw.t3 { width: 11%; height: 11%; top: 20%; left: 10%; animation-delay: 2.4s; }
    @keyframes cpTw { 0%,100% { opacity: 0; transform: scale(.3) rotate(0deg); } 35% { opacity: 1; transform: scale(1) rotate(35deg); } 70% { opacity: 0; transform: scale(.5) rotate(70deg); } }
    .cp-fab-dock:hover .cp-mark-svg, .cp-fab-dock:focus-within .cp-mark-svg { animation-duration: 2.2s, 1.5s; }
    .cp-fab-dock:hover .cp-halo, .cp-fab-dock:focus-within .cp-halo,
    .cp-fab-dock:hover .cp-halo, .cp-fab-dock:focus-within .cp-halo,
    .cp-fab-dock:hover .cp-tw, .cp-fab-dock:focus-within .cp-tw { animation-duration: 1.5s; }

    .cp-fab-dock:hover .cp-fab, .cp-fab-dock:focus-within .cp-fab {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 14px 28px rgba(118,50,205,.42), 0 3px 8px rgba(20,24,34,.16);
    }
    .cp-fab:focus-visible { outline: 2px solid #5b54d6; outline-offset: 4px; }

    /* tooltip is out of flow, so it can never push the icon around */
    .cp-fab-tip {
      position: absolute; right: calc(100% + 12px); top: 50%; z-index: 41;
      transform: translate(6px, -50%); transform-origin: right center;
      padding: 13px 22px; border-radius: 999px; white-space: nowrap; pointer-events: none;
      background: #26243a; color: #fff; font-size: 12.5px; font-weight: 600; letter-spacing: .01em;
      box-shadow: 0 4px 14px rgba(20,24,34,.22);
      opacity: 0; transition: opacity .18s, transform .22s cubic-bezier(.34,1.4,.64,1);
    }
    .cp-fab-dock:hover .cp-fab-tip, .cp-fab-dock:focus-within .cp-fab-tip {
      opacity: 1; transform: translate(0, -50%);
    }

    @media (prefers-reduced-motion: reduce) {
      .cp-mark-svg, .cp-halo, .cp-tw { animation: none; }
      .cp-fab, .cp-fab-tip { transition: none; }
    }
  </style>
</head>

  <div class="topbar">

  <div class="sidebar">
    <a href="index.html" class="sb-item"><span class="material-symbols-outlined">home</span>Home</a>
    <a href="call-center-agent.html" class="sb-item"><span class="material-symbols-outlined">dashboard</span>Dashboard</a>
    <a href="copilot.html" class="sb-item active"><svg style="width:18px;height:18px" aria-hidden="true"><use href="#cpMark"/></svg>Copilot</a>
  </div>

  <div class="main"></div>

  <div class="cp-fab-dock">
    <span class="cp-fab-tip" role="tooltip" id="cpFabTip">Ask Sales Co-Pilot</span>
    <button class="cp-fab" id="cpFab" aria-label="Ask Sales Co-Pilot" aria-describedby="cpFabTip">
      <span class="cp-mark">
        <span class="cp-halo"></span>
        <svg class="cp-mark-svg" aria-hidden="true"><use href="#cpMark"/></svg>
        <svg class="cp-tw t1" aria-hidden="true"><use href="#cpStar"/></svg>
        <svg class="cp-tw t2" aria-hidden="true"><use href="#cpStar"/></svg>
        <svg class="cp-tw t3" aria-hidden="true"><use href="#cpStar"/></svg>
