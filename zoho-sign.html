<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zoho Sign — EXEED</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet" />
  <link href="rtl.css?v=15" rel="stylesheet" />
  <script src="i18n-ar.js?v=25"></script>
  <script src="i18n.js?v=13"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { font-family: Inter, 'Segoe UI', system-ui, sans-serif; background: #f6f7f9; color: #1f2937; -webkit-font-smoothing: antialiased; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400; vertical-align: middle; }
    .zs-toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px); opacity: 0; transition: .2s; z-index: 9500; background: #1f2937; color: #fff; border-radius: 8px; padding: 10px 16px; font-size: 13px; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 24px rgba(15,23,42,.25); pointer-events: none; }
    .zs-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .zs-toast .material-symbols-outlined { color: #6ce9a6; font-size: 18px; }
    .zs-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 10px; color: #475467; text-align: center; padding: 24px; }
    .zs-empty .material-symbols-outlined { font-size: 40px; color: #98a2b3; }
    .zs-empty h1 { font-size: 18px; margin: 0; color: #1f2937; }
  </style>
</head>
<body>
  <div class="zs-toast" id="zsToast" role="status" aria-live="polite"><span class="material-symbols-outlined">check_circle</span><span id="zsToastT"></span></div>
  <script src="zoho-sign.js?v=3"></script>
  <script>
    /* Zoho Sign window — opened from the lead (Send for signature / Sign now / Send via Zoho Sign),
       like the proposal builder. The lead writes the request to localStorage; the result goes back
       through the 'exeedZohoResult' queue and window.opener.zsImportResult(). */
    var toastTimer;
    function showToast(msg) {
      document.getElementById('zsToastT').textContent = msg;
      var t = document.getElementById('zsToast'); t.classList.add('show');
      clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
    }
    (function () {
      var id = new URLSearchParams(location.search).get('req'), req = null;
      try { req = JSON.parse(localStorage.getItem('exeedZohoReq') || 'null'); } catch (e) {}
      if (!req || (id && req.id !== id)) {
        document.body.insertAdjacentHTML('beforeend', '<div class="zs-empty"><span class="material-symbols-outlined">draw</span><h1>No document to sign</h1><p>Open Zoho Sign from a lead — Send for signature or Sign now.</p></div>');
        return;
      }
      document.title = (req.opts.name || req.opts.doc) + ' — Zoho Sign';
      var send = function (res) {
        try {
          var q = JSON.parse(localStorage.getItem('exeedZohoResult') || '[]');
          q.push({ id: req.id, lead: req.lead, row: req.row, docName: req.docName, res: res, ts: Date.now() });
          localStorage.setItem('exeedZohoResult', JSON.stringify(q));
        } catch (e) {}
        try { if (window.opener && !window.opener.closed && window.opener.zsImportResult) window.opener.zsImportResult(); } catch (e) {}
      };
      var o = req.opts; o.page = true; o.onDone = send; o.onDraft = function () { send({ doc: req.docName, mode: 'draft' }); };
      ZohoSign.open(o);
      if (req.docName && !o.direct) { var inp = document.getElementById('zsfName'); if (inp) { inp.value = req.docName; ZohoSign._name(req.docName); } }
    })();
  </script>
</body>
</html>
